<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="谭大米の工作台 - 衣橱、饮食、旅行、进步、退休一站式管理">
<meta name="theme-color" content="#ff6b9d">
<meta name="msapplication-TileColor" content="#ff6b9d">
<meta name="msapplication-TileImage" content="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="谭大米の工作台">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<title>🌸 谭大米の工作台</title>
<style>
/* ==================== 樱花漫画风变量 ==================== */
:root {
  --pink-50: #fff5f7;
  --pink-100: #ffe8ee;
  --pink-200: #ffd1dc;
  --pink-300: #ffb6c1;
  --pink-400: #ff8fab;
  --pink-500: #ff6b9d;
  --pink-600: #e85a87;
  --rose-100: #ffe4ec;
  --rose-200: #ffc8d6;
  --rose-300: #ff9eb5;
  --rose-400: #ff7095;
  --rose-500: #ff4081;
  --purple-200: #e9d4f0;
  --purple-300: #d4a8e0;
  --cream: #fff8f3;
  --lavender: #f5e6f7;

  --bg-1: #ffe5ec;
  --bg-2: #ffd1dc;
  --bg-3: #fff0f5;
  --card-bg: #ffffff;
  --card-border: #ffc8d6;
  --text: #5a3d5c;
  --text-secondary: #a07ca6;
  --text-light: #c5a3c8;
  --accent: #ff6b9d;
  --accent-light: #ffe8ee;
  --success: #7dd3a8;
  --warning: #ffb84d;
  --danger: #ff7a8a;
  --info: #a78bdb;

  --shadow: 0 4px 14px rgba(255, 107, 157, 0.12);
  --shadow-md: 0 6px 20px rgba(255, 107, 157, 0.16);
  --shadow-lg: 0 10px 30px rgba(255, 107, 157, 0.20);
  --radius: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --radius-pill: 999px;

  --font-cute: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-cute);
  background: linear-gradient(135deg, #ffe5ec 0%, #ffd1dc 50%, #ffc0cb 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  position: relative;
  overflow-x: hidden;
}

/* ==================== 漂浮装饰背景 ==================== */
.bg-deco {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-deco .deco {
  position: absolute; opacity: 0.55; animation: floatAround 12s infinite ease-in-out;
  font-size: 20px;
}
.bg-deco .d1 { top: 8%; left: 15%; animation-delay: 0s; font-size: 28px; }
.bg-deco .d2 { top: 18%; right: 12%; animation-delay: 2s; font-size: 24px; }
.bg-deco .d3 { top: 38%; left: 4%; animation-delay: 4s; font-size: 30px; }
.bg-deco .d4 { top: 55%; right: 6%; animation-delay: 1s; font-size: 22px; }
.bg-deco .d5 { bottom: 18%; left: 12%; animation-delay: 3s; font-size: 26px; }
.bg-deco .d6 { bottom: 8%; right: 18%; animation-delay: 5s; font-size: 24px; }
.bg-deco .d7 { top: 28%; right: 30%; animation-delay: 2.5s; font-size: 20px; }
.bg-deco .d8 { top: 70%; left: 35%; animation-delay: 4.5s; font-size: 22px; }
.bg-deco .d9 { top: 5%; left: 45%; animation-delay: 6s; font-size: 18px; }
.bg-deco .d10 { bottom: 30%; right: 30%; animation-delay: 1.5s; font-size: 26px; }
.bg-deco .d11 { top: 48%; left: 25%; animation-delay: 7s; font-size: 20px; }
.bg-deco .d12 { top: 80%; right: 45%; animation-delay: 3.5s; font-size: 24px; }

@keyframes floatAround {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  25% { transform: translate(15px, -20px) rotate(15deg); }
  50% { transform: translate(-10px, -30px) rotate(-10deg); }
  75% { transform: translate(20px, 10px) rotate(20deg); }
}

/* ==================== 自定义滚动条 ==================== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--pink-300); background-clip: padding-box; }

/* ==================== 侧边栏 ==================== */
.sidebar {
  width: 280px; min-width: 280px;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 2px dashed var(--pink-200);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  overflow-y: auto;
  padding: 20px 18px;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.sidebar::-webkit-scrollbar { display: none; }

.brand {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  margin-bottom: 18px;
  position: relative;
}
.brand-title {
  font-size: 26px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d, #ff9eb5, #ffb6c1);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  text-shadow: 0 2px 4px rgba(255,107,157,0.15);
  position: relative;
}
.brand-title::before {
  content: '🌸'; position: absolute; left: -32px; top: 0; font-size: 22px;
  animation: sway 3s ease-in-out infinite;
}
.brand-title::after {
  content: '🌸'; position: absolute; right: -32px; top: 0; font-size: 22px;
  animation: sway 3s ease-in-out infinite reverse;
}
@keyframes sway { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }
.brand-date {
  margin-top: 10px;
  background: linear-gradient(135deg, #ffe8ee, #fff5f7);
  border: 1.5px dashed var(--pink-300);
  border-radius: var(--radius-pill);
  padding: 6px 18px;
  font-size: 13px; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
  position: relative;
}
.brand-date::before { content: '🦄'; font-size: 14px; }
.brand-date::after { content: '💕'; font-size: 14px; }

/* 侧边栏分类 */
.nav-list { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.nav-group {
  background: rgba(255, 255, 255, 0.7);
  border: 2px solid var(--pink-200);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.nav-group:hover {
  background: rgba(255,255,255,0.9);
  border-color: var(--pink-300);
  transform: translateX(4px);
  box-shadow: var(--shadow);
}
.nav-group.active {
  background: linear-gradient(135deg, #ffe8ee, #ffd1dc);
  border-color: var(--pink-400);
  box-shadow: var(--shadow-md);
}
.nav-group-header {
  display: flex; align-items: center; gap: 10px;
  font-size: 16px; font-weight: 700; color: var(--text);
}
.nav-group-header .emoji { font-size: 22px; }
.nav-group-header .name { flex: 1; }
.nav-group-header .arrow { font-size: 12px; color: var(--text-light); transition: transform 0.3s; }
.nav-group.active .nav-group-header .arrow { transform: rotate(90deg); }
.nav-sub {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1.5px dashed var(--pink-200);
  display: none;
  flex-direction: column; gap: 8px;
}
.nav-group.active .nav-sub { display: flex; }
.nav-sub-item {
  font-size: 13px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-sub-item:hover { background: var(--pink-100); color: var(--accent); }

.sidebar-footer {
  margin-top: 16px;
  text-align: center;
  font-size: 11px; color: var(--text-light);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.6} }

/* ==================== 主内容区 ==================== */
.main-wrapper {
  margin-left: 280px; flex: 1; min-height: 100vh;
  display: flex; flex-direction: column;
  padding: 24px 32px;
  position: relative; z-index: 1;
  transition: margin 0.3s ease;
}
.page-header {
  position: sticky; top: 12px; z-index: 50;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px dashed var(--pink-200);
  border-radius: var(--radius);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.page-header .title {
  font-size: 22px; font-weight: 800; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.page-header .title .heart {
  display: inline-block;
  color: var(--accent); font-size: 18px;
  animation: heartbeat 1.4s ease-in-out infinite;
}
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
.page-header .refresh-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--pink-100); border: 1.5px solid var(--pink-300);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.page-header .refresh-btn:hover { background: var(--accent); color: white; transform: rotate(180deg); }

.hamburger {
  display: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--pink-100); border: 1.5px solid var(--pink-300);
  cursor: pointer; font-size: 18px;
  align-items: center; justify-content: center;
}

.content-area { flex: 1; }

/* ==================== 可爱卡片 ==================== */
.cute-card {
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  position: relative;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.cute-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.cute-card-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1.5px dashed var(--pink-200);
}
.cute-card-header .heart-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: var(--pink-100); border-radius: 50%;
  color: var(--accent); font-size: 14px;
}
.cute-card-header .title-text {
  font-size: 16px; font-weight: 700; color: var(--text);
}
.cute-card-header .badge-pill {
  margin-left: auto;
  background: var(--accent-light); color: var(--accent);
  padding: 4px 12px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
}

/* ==================== 按钮 ==================== */
.btn {
  padding: 9px 18px;
  border-radius: var(--radius-pill);
  border: none;
  cursor: pointer;
  font-size: 14px; font-weight: 600;
  font-family: var(--font-cute);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, #ff8fab, #ff6b9d);
  color: white;
  box-shadow: 0 4px 12px rgba(255,107,157,0.3);
}
.btn-pink {
  background: linear-gradient(135deg, #ffb6c1, #ff9eb5);
  color: white;
  box-shadow: 0 4px 12px rgba(255,158,181,0.3);
}
.btn-outline {
  background: white;
  color: var(--text-secondary);
  border: 1.5px solid var(--pink-200);
}
.btn-outline:hover { color: var(--accent); border-color: var(--pink-300); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-xs { padding: 4px 10px; font-size: 11px; }
.btn-block { width: 100%; justify-content: center; }
.btn-ghost { background: rgba(255,255,255,0.6); color: var(--accent); border: 1.5px dashed var(--pink-300); }
.btn-ghost:hover { background: #fff; border-color: var(--accent); }
.closet-toggle { transition: all 0.2s; }

/* ==================== 输入控件 ==================== */
.input, .select, .textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--pink-200);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font-cute);
  background: white;
  color: var(--text);
  transition: all 0.2s;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255,107,157,0.15);
}
.textarea { resize: vertical; min-height: 80px; }

/* ==================== 徽章 ==================== */
.badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
  background: var(--pink-100); color: var(--accent);
}
.badge-pink { background: var(--pink-100); color: var(--accent); }
.badge-rose { background: #ffe4ec; color: var(--rose-500); }
.badge-success { background: #e6f7ed; color: var(--success); }
.badge-warning { background: #fff4e0; color: var(--warning); }
.badge-info { background: #f0e6fa; color: var(--info); }

/* ==================== 列表项 ==================== */
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: rgba(255,232,238,0.4);
  transition: all 0.2s;
  gap: 12px;
}
.list-item:hover { background: rgba(255,232,238,0.7); transform: translateX(4px); }
.list-item .item-info { flex: 1; min-width: 0; }
.list-item .item-title { font-weight: 600; font-size: 14px; color: var(--text); }
.list-item .item-meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.list-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ==================== Tab 切换 ==================== */
.tabs {
  display: flex; gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.tab {
  padding: 9px 20px;
  cursor: pointer;
  font-size: 14px; font-weight: 600;
  border-radius: var(--radius-pill);
  background: rgba(255,255,255,0.7);
  color: var(--text-secondary);
  transition: all 0.2s;
  border: 1.5px solid var(--pink-200);
}
.tab:hover { color: var(--accent); border-color: var(--pink-300); }
.tab.active {
  background: linear-gradient(135deg, #ff8fab, #ff6b9d);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(255,107,157,0.3);
}

/* ==================== Toast ==================== */
.toast {
  position: fixed; top: 24px; right: 24px; z-index: 400;
  padding: 12px 22px;
  border-radius: var(--radius-pill);
  background: white;
  box-shadow: var(--shadow-lg);
  font-size: 14px; font-weight: 600;
  border: 2px solid var(--pink-200);
  animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  display: flex; align-items: center; gap: 8px;
}
@keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ==================== 可访问性 ==================== */
.btn:focus-visible, .tab:focus-visible, .nav-group:focus-visible, .clothing-item:focus-visible {
  outline: 2.5px solid var(--accent); outline-offset: 2px;
}
.tab, .nav-group, .clothing-item { user-select: none; }
button { font-family: var(--font-cute); }

/* ==================== 动画 ==================== */
@keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }
.shaking { animation: shake 0.5s ease-in-out 3; }
@keyframes bounceIn { 0%{transform:scale(0.3);opacity:0} 50%{transform:scale(1.08)} 70%{transform:scale(0.95)} 100%{transform:scale(1);opacity:1} }
@keyframes sparkle-anim { 0%,100%{opacity:0;transform:scale(0) rotate(0)} 50%{opacity:1;transform:scale(1) rotate(180deg)} }
.sparkle { animation: sparkle-anim 1.5s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* ==================== 空状态 ==================== */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
.empty-state p { font-size: 14px; }

/* ==================== 模态框 ==================== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(90, 61, 92, 0.35);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: white;
  border-radius: var(--radius);
  padding: 24px;
  max-width: 520px; width: 92%;
  max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  border: 2px solid var(--pink-200);
}
.modal h3 {
  margin-bottom: 16px; font-size: 18px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* ==================== 网格 ==================== */
.grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }

/* ==================== 表单 ==================== */
.form-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 140px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  margin-bottom: 5px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 4px;
}

/* ==================== 衣架网格 ==================== */
.wardrobe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}
.clothing-item {
  background: white;
  border: 2px solid var(--pink-200);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.clothing-item:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-4px) rotate(-1deg);
  border-color: var(--pink-300);
}
.clothing-item .cl-img { width: 100%; height: 150px; object-fit: cover; background: #fff8fb; }
.clothing-item .cl-img-placeholder {
  width: 100%; height: 150px;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; background: linear-gradient(135deg, #fff8fb, #ffe8ee);
}
.clothing-item .cl-name { padding: 8px 10px 2px; font-size: 13px; font-weight: 600; }
.clothing-item .cl-cat { padding: 2px 10px 10px; font-size: 11px; color: var(--accent); }

/* ==================== 上传区域 ==================== */
.upload-zone {
  border: 2.5px dashed var(--pink-300);
  border-radius: var(--radius);
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  background: linear-gradient(135deg, #fff8fb, #ffe8ee);
  margin-bottom: 16px;
  transition: all 0.3s;
}
.upload-zone:hover, .upload-zone.drag-over {
  background: linear-gradient(135deg, #ffe8ee, #ffd1dc);
  border-color: var(--accent);
  transform: scale(1.01);
}
.upload-zone .upload-icon { font-size: 44px; margin-bottom: 8px; }
.upload-zone .upload-text { font-weight: 700; color: var(--accent); }
.upload-zone .upload-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }

/* AI 识别 */
.ai-processing {
  text-align: center; padding: 24px;
  background: linear-gradient(135deg, #fff8fb, #ffe8ee);
  border-radius: var(--radius);
  border: 2px solid var(--pink-200);
}
.ai-spinner {
  display: inline-block; width: 44px; height: 44px;
  border: 4px solid var(--pink-200);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ai-result-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  background: #fff8fb; border: 1.5px solid var(--pink-200);
  border-radius: var(--radius-sm); margin: 6px 0;

// 写 localStorage 时剥离衣物 base64 图片（避免爆容量），云端同步用完整数据
function stripImagesForLocal(d){
  if(!d||!Array.isArray(d.wardrobe))return d;
  const copy=JSON.parse(JSON.stringify(d));
  copy.wardrobe=copy.wardrobe.map(it=>({...it, image:''}));
  return copy;
}
function saveData(d){
  const slim=stripImagesForLocal(d);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(slim));}
  catch(e){
    // 存储超限：自动清理最早的历史记录后重试
    try{
      if(Array.isArray(d.milkTeaHistory)&&d.milkTeaHistory.length>20)d.milkTeaHistory=d.milkTeaHistory.slice(-20);
      if(Array.isArray(d.newsItems)&&d.newsItems.length>30)d.newsItems=d.newsItems.slice(0,30);
      if(Array.isArray(d.dietPlans)&&d.dietPlans.length>30)d.dietPlans=d.dietPlans.slice(-30);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(stripImagesForLocal(d)));
      showToast('⚠️ 存储空间不足，已自动清理旧数据','warning');
    }catch(e2){showToast('💔 存储空间不足，请删除部分衣物图片','error');}
  }
}

// ==================== IndexedDB 图片存储 ====================
const IMG_DB_NAME='workbuddy_images';
const IMG_STORE='images';

function openImageDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IMG_DB_NAME,1);
    req.onerror=()=>reject(req.error);
    req.onsuccess=()=>resolve(req.result);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
    };
  });
}
async function saveImage(id,dataUrl){
  if(!id||!dataUrl)return;
  const db=await openImageDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IMG_STORE,'readwrite');
    const store=tx.objectStore(IMG_STORE);
    const req=store.put(dataUrl,id);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
async function getImage(id){
  if(!id)return null;
  try{
    const db=await openImageDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(IMG_STORE,'readonly');
      const store=tx.objectStore(IMG_STORE);
      const req=store.get(id);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){return null;}
}
async function deleteImage(id){
  if(!id)return;
  try{
    const db=await openImageDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(IMG_STORE,'readwrite');
      const store=tx.objectStore(IMG_STORE);
      const req=store.delete(id);
      req.onsuccess=()=>resolve();
      req.onerror=()=>reject(req.error);
    });
  }catch(e){}
}

// 迁移旧数据：把 wardrobe 中的 base64 图片迁移到 IndexedDB
async function migrateOldImages(){
  let migrated=0;
  for(const item of AppData.wardrobe||[]){
    if(item.image && typeof item.image==='string' && item.image.startsWith('data:') && !item.imageId){
      const imageId = 'img_'+item.id;
      await saveImage(imageId, item.image);
      item.imageId = imageId;
      migrated++;
    }
  }
  if(migrated>0){
    saveData(AppData);
    showToast(`✨ 已将 ${migrated} 张图片存入本地缓存`);
  }
}

}

// 图片压缩
function compressImage(file,maxW=480,quality=0.55){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  {patterns:['阔腿裤','直筒裤','休闲裤','pants','西裤','烟管裤','锥形裤'],category:'长裤',season:'春秋',icon:'👖'},

  // 特殊
  {patterns:['运动','sport','健身','瑜伽','gym','athletic'],category:'运动装',season:'夏',icon:'🎽'},
  {patterns:['内衣','bra','内裤','文胸','underwear','睡衣','家居服'],category:'内衣家居',season:'夏',icon:'👙'},
  {patterns:['泳衣','bikini','比基尼','泳装'],category:'泳衣',season:'夏',icon:'🩱'},
  {patterns:['汉服','旗袍','和服','民族风'],category:'特色服饰',season:'春秋',icon:'👘'},
];
const MATERIAL_RULES=[
  {patterns:['棉','cotton','纯棉'],material:'棉'},
  {patterns:['麻','linen','亚麻'],material:'麻'},
  {patterns:['丝','silk','真丝','桑蚕丝'],material:'真丝'},
  {patterns:['羊毛','wool','羊绒','cashmere'],material:'羊毛'},
  {patterns:['涤纶','polyester','聚酯纤维'],material:'涤纶'},
  {patterns:['牛仔','denim'],material:'牛仔布'},
  {patterns:['雪纺','chiffon'],material:'雪纺'},
  {patterns:['蕾丝','lace'],material:'蕾丝'},
  {patterns:['皮质','leather','pu'],material:'皮质'},
];
const BRAND_PATTERNS=['优衣库','uniqlo','zara','hm','h&m','ur','only','vero moda','乐町','太平鸟','ochirly','moussy','sly','cos','arket','massimo dutti'];
const COLOR_STYLE=[
  {colors:['白','white','米白'],style:'简约清新'},
  {colors:['黑','black'],style:'酷帅暗黑'},
  {colors:['粉','pink'],style:'甜美可爱'},
  {colors:['蓝','blue'],style:'休闲日常'},
  {colors:['红','red'],style:'复古优雅'},
  {colors:['绿','green','军绿'],style:'复古文艺'},
  {colors:['黄','yellow','姜黄'],style:'活泼元气'},
  {colors:['紫','purple','薰衣草'],style:'浪漫温柔'},
  {colors:['灰','grey'],style:'高级简约'},
  {colors:['棕','brown','卡其'],style:'复古文艺'},
  {colors:['条纹','stripe'],style:'法式休闲'},
  {colors:['格子','check','plaid'],style:'学院复古'},
  {colors:['碎花','floral','印花'],style:'甜美田园'},
];
function aiRecognize(fileName){
  const lo=fileName.toLowerCase().replace(/\.[^.]+$/,'');
  let cat='上衣',season='春秋',style='简约基础',conf=55,material='',brand='';
  let best=null,score=0,matchedPatterns=[];

  // 1. 品类匹配（支持多特征累加置信度）
  for(const r of AI_RULES){
    for(const p of r.patterns){
      if(lo.includes(p)){
        matchedPatterns.push(p);
        if(p.length>score){score=p.length;best=r;}
      }
    }
  }
  if(best){
    cat=best.category;season=best.season;
    conf=Math.min(92,60+score*4+Math.min(matchedPatterns.length-1,3)*5);
  }

  // 2. 颜色风格匹配
  let colorHits=0;
  for(const cs of COLOR_STYLE){
    for(const c of cs.colors){
      if(lo.includes(c)){style=cs.style;colorHits++;conf=Math.min(96,conf+6);break;}
    }
  }

  // 3. 材质识别
  for(const m of MATERIAL_RULES){
    for(const p of m.patterns){
      if(lo.includes(p)){material=m.material;conf=Math.min(97,conf+5);break;}
    }
    if(material)break;
  }

  // 4. 品牌识别
  for(const b of BRAND_PATTERNS){
    if(lo.includes(b)){brand=b.toUpperCase();conf=Math.min(98,conf+4);break;}
  }

  // 5. 生成友好名称
  let name=fileName.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ').replace(/\s+/g,' ').trim();
  if(name.length>20)name=name.slice(0,20);
  if(!name||name.length<2){
    name=`${material||''}${brand?brand+' ':''}${style}${cat}`.trim();
  }

  // 6. 置信度保底：至少匹配到品类或颜色才给高分
  if(!best&&colorHits===0)conf=45;

  return {name,category:cat,season,style,material,brand,confidence:conf,matchedPatterns};
}

function addClothing(){
  const cats=['上衣','T恤','衬衫','毛衣','卫衣','背心吊带','风衣','大衣','夹克','羽绒服','西装','开衫','防晒衣','半身裙','连衣裙','牛仔裤','长裤','短裤','打底裤','运动装','内衣家居','泳衣','特色服饰'];
  showModal('➕ 手动添加衣物',`<div class="form-group"><label>📛 名称</label><input class="input" id="newClName" placeholder="如：白色简约衬衫"></div><div class="form-row"><div class="form-group"><label>🏷️ 品类</label><select class="select" id="newClCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-group"><label>🍂 季节</label><select class="select" id="newClSeason"><option>春</option><option>夏</option><option>秋</option><option>冬</option></select></div></div><div class="form-group"><label>🎨 风格</label><input class="input" id="newClStyle" placeholder="如：休闲、商务"></div><div class="form-group"><label>📝 备注</label><textarea class="textarea" id="newClNote"></textarea></div><div class="form-group"><label>🖼️ 图片URL</label><input class="input" id="newClImg"></div><div class="upload-zone" id="singleUploadZone" style="padding:18px;"><span style="font-size:24px;">📤</span> 点击上传图片</div><input type="file" id="singleFileInput" accept="image/*" style="display:none;">`,async(overlay)=>{
    const name=overlay.querySelector('#newClName').value.trim();
    if(!name){showToast('请输入名称','error');return false;}
    const id=genId();
    let imageId='';
    const uploaded=overlay._uploadedImage;
    const urlInput=overlay.querySelector('#newClImg').value.trim();
    if(uploaded){
      imageId='img_'+id;
      await saveImage(imageId, uploaded);
    }else if(urlInput){
      // 外部 URL 仍直接存到 image 字段（不需要 IndexedDB）
      // 这里为了统一，也存到 IndexedDB
      imageId='img_'+id;
      await saveImage(imageId, urlInput);
    }
    AppData.wardrobe.push({id,name,category:overlay.querySelector('#newClCat').value,season:overlay.querySelector('#newClSeason').value,style:overlay.querySelector('#newClStyle').value,note:overlay.querySelector('#newClNote').value,imageId,image:uploaded||urlInput||'',archived:false,createdAt:today()});
    saveData(AppData);cloudSaveForce();renderWardrobe();showToast('✨ 衣物添加成功！');
  });
  setTimeout(()=>{
    const zone=document.getElementById('singleUploadZone');
    const input=document.getElementById('singleFileInput');
    if(!zone||!input)return;
    zone.onclick=()=>input.click();
    input.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      const dataUrl=await compressImage(file);
      const r=aiRecognize(file.name);
      const nameEl=document.getElementById('newClName');const catEl=document.getElementById('newClCat');const seasonEl=document.getElementById('newClSeason');const styleEl=document.getElementById('newClStyle');const imgEl=document.getElementById('newClImg');
      if(nameEl&&!nameEl.value)nameEl.value=r.name;
      if(catEl)catEl.value=r.category;
      if(seasonEl)seasonEl.value=r.season;
      if(styleEl&&!styleEl.value)styleEl.value=r.style;
      if(imgEl)imgEl.value=dataUrl;
      const overlay=document.querySelector('.modal-overlay');
      if(overlay)overlay._uploadedImage=dataUrl;
      zone.innerHTML=`<span style="font-size:24px;">✅</span> 已上传 · AI建议: ${r.category}`;
    };
  },100);
}

function renderOutfit(){
  document.getElementById('wardrobeContent').innerHTML=`
    <div class="cute-card">

        <div><div style="font-size:28px;font-weight:800;" id="weatherTemp">--°C</div><div style="font-size:13px;color:var(--text-secondary);" id="weatherDesc">获取天气中...</div></div>
      </div>
      <div id="outfitSuggestion" style="text-align:center;padding:14px;"><p style="color:var(--text-light);">🤖 AI 正在分析你的衣橱...</p></div>
      <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">

      </div>
    </div>`;

async function fetchWeatherAndRecommend(){
  try{
    const pos=await new Promise((resolve,reject)=>{
      if(!navigator.geolocation){reject();return;}
      navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:5000});
    }).catch(()=>({coords:{latitude:39.9,longitude:116.4}}));
    const resp=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true&timezone=auto`);
    const data=await resp.json();
    await recommendOutfit(data.current_weather.temperature,data.current_weather.weathercode);
    const wm={0:'☀️ 晴',1:'🌤️ 晴间多云',2:'⛅ 多云',3:'☁️ 阴',45:'🌫️ 雾',51:'🌦️ 小雨',61:'🌧️ 阵雨',71:'❄️ 小雪',80:'⛈️ 雷阵雨'};
    document.getElementById('weatherIcon').textContent=data.current_weather.weathercode<=2?'☀️':data.current_weather.weathercode<=3?'⛅':data.current_weather.weathercode<=55?'🌧️':'🌨️';
    document.getElementById('weatherTemp').textContent=data.current_weather.temperature+'°C';
    document.getElementById('weatherDesc').textContent=wm[data.current_weather.weathercode]||'未知';
  }catch(e){
    await recommendOutfit(22,1);
    document.getElementById('weatherIcon').textContent='🌤️';
    document.getElementById('weatherTemp').textContent='22°C';
    document.getElementById('weatherDesc').textContent='晴间多云（模拟）';
  }
}
async function recommendOutfit(temp,code){
  const items=AppData.wardrobe.filter(w=>!w.archived);
  const isRain=code>=51&&code<=65;
  let rule,sug;
  if(temp>=30){rule='夏';sug='☀️ 炎热·轻薄透气穿搭';}
  else if(temp>=22){rule='夏';sug='🌿 舒适·清爽简约穿搭';}
  else if(temp>=15){rule='春秋';sug='🍂 微凉·薄外套+长袖';}
  else if(temp>=5){rule='春秋';sug='🧣 转凉·毛衣+外套';}
  else{rule='冬';sug='❄️ 寒冷·保暖羽绒服+毛衣';}
  if(isRain)sug+=' ☔ 带伞~';
  // 优先按季节匹配，无匹配再回退到全部
  const seasonMatch=i=>i.season===rule||(rule==='春秋'&&(i.season==='春'||i.season==='秋'))||i.season==='春秋';
  let tops=items.filter(i=>['上衣','T恤','衬衫','毛衣','卫衣'].includes(i.category)&&seasonMatch(i));
  if(tops.length===0)tops=items.filter(i=>['上衣','T恤','衬衫','毛衣','卫衣'].includes(i.category));
  let bottoms=items.filter(i=>['长裤','短裤','半身裙','连衣裙'].includes(i.category)&&seasonMatch(i));
  if(bottoms.length===0)bottoms=items.filter(i=>['长裤','短裤','半身裙','连衣裙'].includes(i.category));
  let outers=items.filter(i=>['外套','风衣','大衣','夹克'].includes(i.category)&&seasonMatch(i));
  if(outers.length===0)outers=items.filter(i=>['外套','风衣','大衣','夹克'].includes(i.category));
  const pick=a=>a.length>0?a[Math.floor(Math.random()*a.length)]:null;
  const top=pick(tops),bottom=pick(bottoms),outer=temp<20?pick(outers):null;
  const el=document.getElementById('outfitSuggestion');
  if(!el)return;
  // 单件衣物卡片：优先显示用户上传的真实照片，取不到时回退 emoji
  const cardHtml=async(item,label,emoji)=>{
    if(!item)return '';
    const src=await getClothingImageSrc(item);
    const inner=src
      ?`<img src="${src}" style="width:58px;height:58px;object-fit:cover;border-radius:10px;" alt="${escapeHtml(item.name)}">`
      :`<div style="font-size:32px;">${emoji}</div>`;
    return `<div style="text-align:center;background:linear-gradient(135deg,#fff8fb,#ffe8ee);border-radius:var(--radius-md);padding:10px;width:88px;"><div style="width:58px;height:58px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;overflow:hidden;">${inner}</div><div style="font-size:12px;font-weight:600;">${escapeHtml(item.name)}</div><div style="font-size:10px;color:var(--accent);">${label}</div></div>`;
  };
  let html=`<p style="color:var(--text-secondary);margin-bottom:12px;font-weight:600;">📝 ${sug}</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">`;
  html+=await cardHtml(top,'上装','👚');
  html+=await cardHtml(bottom,'下装','👖');
  html+=await cardHtml(outer,'外套','🧥');
  html+=`<div style="text-align:center;background:linear-gradient(135deg,#fff8fb,#ffe8ee);border-radius:var(--radius-md);padding:10px;width:88px;"><div style="font-size:32px;">💍</div><div style="font-size:12px;font-weight:600;">简约配饰</div><div style="font-size:10px;color:var(--accent);">配饰</div></div></div>`;
  html+=`<div style="text-align:center;margin-top:14px;"><button class="btn btn-pink btn-sm" onclick="saveOutfitTemplate('${top?.id||''}','${bottom?.id||''}','${outer?.id||''}')">💾 保存模板</button></div>`;
  el.innerHTML=html;
}
function generateOutfit(){renderOutfit();}
function saveOutfitTemplate(tid,bid,oid){
  const t=AppData.wardrobe.find(w=>w.id===tid),b=AppData.wardrobe.find(w=>w.id===bid),o=AppData.wardrobe.find(w=>w.id===oid);
  const imgs=[t?.image,b?.image,o?.image].filter(Boolean);
  AppData.outfitTemplates.push({id:genId(),items:[t?.name,b?.name,o?.name].filter(Boolean),imgs,weather:'当前',date:today(),scene:'日常',note:''});
  saveData(AppData);showToast('✨ 模板已保存');
}
function manualOutfit(){
  const items=AppData.wardrobe.filter(w=>!w.archived);
  showModal('✋ 手动搭配',`<div class="form-group"><label>👚 上衣</label><select class="select" id="manTop"><option value="">不选</option>${items.filter(i=>['上衣','T恤','衬衫','毛衣','卫衣'].includes(i.category)).map(i=>`<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('')}</select></div><div class="form-group"><label>👖 下装</label><select class="select" id="manBottom"><option value="">不选</option>${items.filter(i=>['长裤','短裤','半身裙','连衣裙'].includes(i.category)).map(i=>`<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('')}</select></div><div class="form-group"><label>🧥 外套</label><select class="select" id="manOuter"><option value="">不选</option>${items.filter(i=>['外套','风衣','大衣','夹克'].includes(i.category)).map(i=>`<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('')}</select></div><div class="form-group"><label>🎬 场景</label><input class="input" id="manScene" placeholder="如：上班通勤"></div>`,(overlay)=>{
    const t=items.find(i=>i.id===overlay.querySelector('#manTop').value);
    const b=items.find(i=>i.id===overlay.querySelector('#manBottom').value);
    const o=items.find(i=>i.id===overlay.querySelector('#manOuter').value);
    const scene=overlay.querySelector('#manScene').value||'日常';
    const imgs=[t?.image,b?.image,o?.image].filter(Boolean);
    AppData.outfitTemplates.push({id:genId(),items:[t?.name,b?.name,o?.name].filter(Boolean),imgs,weather:'手动',date:today(),scene,note:''});
    saveData(AppData);showToast('✨ 已保存');
  });
}
function renderTemplates(){
  const temps=AppData.outfitTemplates;
  document.getElementById('wardrobeContent').innerHTML=`<div class="cute-card"><div class="cute-card-header"><span class="heart-icon">💗</span><span class="title-text">穿搭模板库</span><span class="badge-pill">${temps.length}套</span></div>${temps.length===0?'<div class="empty-state"><div class="empty-icon">📒</div><p>还没有穿搭模板~</p></div>':temps.map(t=>`<div class="list-item"><div class="item-info"><div class="item-title">👗 ${escapeHtml(t.items.join(' + ')||'未命名')}</div><div class="item-meta">${escapeHtml(t.date)} · ${escapeHtml(t.scene)}</div></div><div class="item-actions"><button class="btn btn-outline btn-xs" onclick="viewTemplate('${t.id}')">查看</button><button class="btn btn-danger btn-xs" onclick="deleteTemplate('${t.id}')">删除</button></div></div>`).join('')}</div>`;

function viewTemplate(id){const t=AppData.outfitTemplates.find(x=>x.id===id);if(!t)return;const imgs=(t.imgs||[]).map(src=>`<img src="${src}" style="width:62px;height:62px;object-fit:cover;border-radius:10px;margin:4px;border:1px solid var(--pink-200);">`).join('');showModal('📒 穿搭模板',`${imgs?`<div style="display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:12px;">${imgs}</div>`:'<p style="color:var(--text-light);margin-bottom:10px;">（暂无照片）</p>'}<p><strong>搭配：</strong>${escapeHtml(t.items.join(' + '))}</p><p><strong>场景：</strong>${escapeHtml(t.scene)}</p><p><strong>日期：</strong>${escapeHtml(t.date)}</p>`,()=>true);}
function deleteTemplate(id){AppData.outfitTemplates=AppData.outfitTemplates.filter(t=>t.id!==id);saveData(AppData);renderTemplates();showToast('已删除');}
</script>

function recognizeFood(fileName){
  const lo=fileName.toLowerCase().replace(/\.[^.]+$/,'');
  let best=null,maxLen=0;
  for(const food in FOOD_DB){
    if(lo.includes(food)&&food.length>maxLen){maxLen=food.length;best=food;}
  }
  // 拼音/英文匹配
  const pinyinMap={fan:'米饭',miantiao:'面条',jidan:'鸡蛋',jirou:'鸡肉',niurou:'牛肉',zhurou:'猪肉',yu:'鱼',xia:'虾',pingguo:'苹果',xiangjiao:'香蕉',niunai:'牛奶',mianbao:'面包',shala:'沙拉',hanbao:'汉堡',pisa:'披萨',huoguo:'火锅'};
  if(!best){
    for(const py in pinyinMap){
      if(lo.includes(py)){best=pinyinMap[py];break;}
    }
  }
  if(best){
    return {name:best,calPer100g:FOOD_DB[best],estimatedCal:Math.round(FOOD_DB[best]*1.5)}; // 默认150g
  }
  return {name:fileName.replace(/\.[^.]+$/,''),calPer100g:100,estimatedCal:150};
}

let _shakeLock=false;
function _doShake(resultEl){
  if(_shakeLock)return; // 防连击：动画期间忽略重复触发

  const brandBadge=pick.brand?`<span class="badge-pill" style="background:var(--accent);color:white;">${escapeHtml(pick.brand)}</span>`:'';
  const resultHTML=`<div class="bounceIn" style="animation:bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);"><div style="font-size:54px;margin-bottom:4px;">🧋</div><div style="margin-bottom:4px;">${brandBadge}</div><div style="font-size:22px;font-weight:800;color:var(--accent);margin:6px 0;">${escapeHtml(pick.name)}</div><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;"><span class="badge-rose">🍬 ${sweetness}</span><span class="badge-info">🧊 ${ice}</span><span class="badge-warning">🧋 ${topping}</span></div></div>`;
  resultEl.innerHTML=resultHTML;
  const container=document.getElementById('dietContent');
  if(container)container.dataset.lastMilkTeaResult=resultHTML;
  // 实时更新历史
  const hist=AppData.milkTeaHistory.slice().reverse().slice(0,10);

// 获取实时天气（联网）
async function fetchWeather(city){
  try{
    const resp=await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`,{signal:AbortSignal.timeout(5000)});
    const data=await resp.json();
    const cur=data.current_condition[0];
    return {temp:parseInt(cur.temp_C),desc:cur.lang_zh?.[0]?.value||cur.weatherDesc[0].value,humidity:cur.humidity,icon:cur.weatherCode};
  }catch(e){
    return null;
  }
}

// 计算交通方式和时间
function getTransportInfo(dist,transport){
  if(transport==='飞机'){
    const hours=Math.max(1,Math.round(dist/800*10)/10);
    return {time:`${hours}小时`,price:Math.round(dist*0.8),icon:'✈️'};
  }else if(transport==='高铁'){
    const hours=Math.max(1,Math.round(dist/250*10)/10);
    return {time:`${hours}小时`,price:Math.round(dist*0.4),icon:'🚄'};
  }else{ // 自驾
    const hours=Math.max(2,Math.round(dist/100*10)/10);
    return {time:`${hours}小时`,price:Math.round(dist*0.6),icon:'🚗'};
  }
}

async function generateTravelPlanV2(){
  const from=document.getElementById('trFrom').value;
  const season=document.getElementById('trSeason').value;
  const days=Math.max(1,Math.min(10,parseInt(document.getElementById('trDays').value)||3));
  const budget=Math.max(500,parseInt(document.getElementById('trBudget').value)||3000);
  const people=Math.max(1,parseInt(document.getElementById('trPeople').value)||2);
  const pref=document.getElementById('trPreference').value;
  const trans=document.getElementById('trTransport').value;

  // 筛选目的地
  let candidates=DEST_DB.filter(d=>{
    if(season&&d.bestSeason!==season)return false;
    if(pref&&!d.tags.includes(pref))return false;
    if(d.days>days+1)return false; // 建议天数不超过计划天数+1
    if(d.budget>budget*1.2)return false; // 预算浮动20%

  const dist=dest.dist[from]||1000;
  const transInfo=getTransportInfo(dist,trans);

  // 生成行程
  let itinerary='';
  const spots=dest.spots;
  for(let i=0;i<days;i++){
    const spot1=spots[i%spots.length];
    const spot2=spots[(i+1)%spots.length];

      itinerary+=`<div style="background:#fff8fb;padding:10px;border-radius:10px;margin-bottom:8px;"><strong>Day ${i+1}:</strong> ${transInfo.icon} 抵达${dest.name} → ${spot1} → 品尝${food}</div>`;
    }else if(i===days-1){
      itinerary+=`<div style="background:#fff8fb;padding:10px;border-radius:10px;margin-bottom:8px;"><strong>Day ${i+1}:</strong> ${spot1} → 购买伴手礼 → ${transInfo.icon} 返程</div>`;
    }else{
      itinerary+=`<div style="background:#fff8fb;padding:10px;border-radius:10px;margin-bottom:8px;"><strong>Day ${i+1}:</strong> ${spot1} → ${spot2} → 品尝${food}</div>`;
    }
  }

  // 显示加载中
  document.getElementById('travelResult').innerHTML=`<div class="cute-card" style="text-align:center;padding:30px;"><div class="ai-spinner"></div><p style="margin-top:10px;">正在获取${dest.name}实时天气...</p></div>`;

        <div style="font-size:24px;font-weight:800;">${weather.temp}°C</div>
        <div style="font-size:12px;color:#0369a1;">${escapeHtml(weather.desc)} · 湿度${weather.humidity}%</div>
      </div>
      <div style="margin-left:auto;font-size:11px;color:#0369a1;">实时天气</div>
    </div>`:'<div style="background:#f3f4f6;padding:10px;border-radius:10px;margin-bottom:12px;font-size:12px;color:#6b7280;">天气数据获取失败，请出行前查询</div>';

  // 费用估算
  const hotelCost=Math.round(budget*0.4);
  const foodCost=Math.round(budget*0.3);
  const ticketCost=Math.round(budget*0.15);
  const otherCost=budget-hotelCost-foodCost-ticketCost;

  const resultHtml=`
    <div class="cute-card">
      <div class="cute-card-header">
        <span class="heart-icon">💗</span>

      <!-- 目的地介绍 -->
      <div style="background:linear-gradient(135deg,#ffe5ec,#ffd1dc);padding:16px;border-radius:var(--radius-md);margin-bottom:14px;text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">${dest.tags.includes('海边度假')?'🏖️':dest.tags.includes('自然风光')?'🏔️':dest.tags.includes('美食之旅')?'🍜':'🏛️'}</div>

        </div>
        <div style="background:#fff8fb;padding:12px;border-radius:10px;text-align:center;">
          <div style="font-size:20px;">💰</div>

function saveTravelPlanV2(name,days,budget,people,season,pref,trans,dist,transPrice){
  const dest=DEST_DB.find(d=>d.name===name);
  const itinerary=dest.spots.map((s,i)=>'Day'+(i+1)+': '+s).join('\n');
  const fullPlan='【'+name+days+'日游】\n出发：'+document.getElementById('trFrom').options[document.getElementById('trFrom').selectedIndex].text+'\n距离：约'+dist+'km\n交通：'+trans+' ¥'+transPrice+'\n天数：'+days+'天\n预算：¥'+budget+'/人\n人数：'+people+'人\n\n行程安排：\n'+itinerary+'\n\n美食推荐：'+dest.foods;
  AppData.travelPlans.push({
    id:genId(),title:name+days+'日游',destination:name,season,days,budget,attendees:people,
    preference:pref,transport:trans,fullPlan,expenses:[],outfits:[],poses:[],createdAt:today(),pinned:false
  });
  saveData(AppData);showToast('✨ 已保存到我的计划');
}
function renderTravelPlans(){
  const plans=AppData.travelPlans.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  document.getElementById('travelContent').innerHTML=`<div class="cute-card"><div class="cute-card-header"><span class="heart-icon">💗</span><span class="title-text">我的旅行计划</span><button class="btn btn-primary btn-sm" onclick="addTravelPlan()">➕ 新建计划</button></div>${plans.length===0?'<div class="empty-state"><div class="empty-icon">✈️</div><p>还没有旅行计划~<br>点击"新建计划"开始规划吧！</p></div>':plans.map(p=>{
    const totalExpense=(p.expenses||[]).reduce((s,e)=>s+e.amount,0);
    const outfitsCount=(p.outfits||[]).length;
    const posesCount=(p.poses||[]).length;
    return `<div class="list-item" style="${p.pinned?'border-left:3px solid var(--accent);background:linear-gradient(135deg,#ffe5ec,#fff5f7);':''}">
      <div class="item-info">
        <div class="item-title">${p.pinned?'📌 ':''}✈️ ${escapeHtml(p.title)}</div>
        <div class="item-meta">${escapeHtml(p.destination)} · ${escapeHtml(p.season)}季 · ${p.days}天 · ${p.attendees}人</div>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
          <span class="badge-pill" style="font-size:10px;">💰 ¥${totalExpense}</span>
          <span class="badge-pill" style="font-size:10px;">👔 ${outfitsCount}套</span>
          <span class="badge-pill" style="font-size:10px;">📸 ${posesCount}个</span>
        </div>
      </div>
      <div class="item-actions">
        <button class="btn btn-outline btn-xs" onclick="togglePinTravel('${p.id}')">${p.pinned?'取消':'📌'}</button>
        <button class="btn btn-primary btn-xs" onclick="viewTravelPlanV2('${p.id}')">管理</button>
        <button class="btn btn-danger btn-xs" onclick="deleteTravelPlan('${p.id}')">删</button>
      </div>
    </div>`}).join('')}</div>`;
}

function togglePinTravel(id){
  const p=AppData.travelPlans.find(x=>x.id===id);if(!p)return;
  p.pinned=!p.pinned;saveData(AppData);renderTravelPlans();showToast(p.pinned?'📌 已置顶':'已取消置顶');
}

function addTravelPlan(){
  showModal('➕ 新建旅行计划',`
    <div class="form-group"><label>📛 计划名称</label><input class="input" id="tpTitle" placeholder="如：五一成都游"></div>
    <div class="form-row"><div class="form-group"><label>📍 目的地</label><input class="input" id="tpDest" placeholder="如：成都"></div><div class="form-group"><label>📅 天数</label><input class="input" type="number" id="tpDays" value="3" min="1"></div></div>
    <div class="form-row"><div class="form-group"><label>💰 预算(总)</label><input class="input" type="number" id="tpBudget" value="3000"></div><div class="form-group"><label>👥 人数</label><input class="input" type="number" id="tpPeople" value="2" min="1"></div></div>
    <div class="form-row"><div class="form-group"><label>🌸 季节</label><select class="select" id="tpSeason"><option>春</option><option>夏</option><option>秋</option><option>冬</option></select></div><div class="form-group"><label>🚗 交通</label><select class="select" id="tpTrans"><option>高铁</option><option>飞机</option><option>自驾</option></select></div></div>`,(o)=>{
    const title=o.querySelector('#tpTitle').value.trim(),dest=o.querySelector('#tpDest').value.trim();
    if(!title||!dest){showToast('请填写名称和目的地','error');return false;}
    AppData.travelPlans.push({
      id:genId(),title,destination:dest,days:parseInt(o.querySelector('#tpDays').value)||3,
      budget:parseInt(o.querySelector('#tpBudget').value)||3000,attendees:parseInt(o.querySelector('#tpPeople').value)||2,
      season:o.querySelector('#tpSeason').value,transport:o.querySelector('#tpTrans').value,
      preference:'',fullPlan:'',expenses:[],outfits:[],poses:[],createdAt:today(),pinned:false
    });
    saveData(AppData);renderTravelPlans();showToast('✨ 计划已创建');
  });
}

// 查看和管理旅行计划（三类清单）
function viewTravelPlanV2(id){
  const p=AppData.travelPlans.find(x=>x.id===id);if(!p)return;
  const totalExpense=(p.expenses||[]).reduce((s,e)=>s+e.amount,0);
  const remainBudget=p.budget-totalExpense;

  const content=`
    <div style="max-height:65vh;overflow-y:auto;">
      <!-- 基本信息 -->
      <div style="background:linear-gradient(135deg,#ffe5ec,#ffd1dc);padding:14px;border-radius:var(--radius-md);margin-bottom:14px;text-align:center;">
        <div style="font-size:20px;font-weight:800;">✈️ ${escapeHtml(p.title)}</div>
        <div style="font-size:13px;margin-top:4px;">${escapeHtml(p.destination)} · ${p.days}天 · ${p.attendees}人 · ${p.season}季</div>
      </div>

      <!-- Tab切换 -->
      <div class="tabs" style="margin-bottom:12px;">
        <div class="tab active" data-tptab="expense" onclick="switchTravelTab('${p.id}','expense',this)">💰 花费储备</div>
        <div class="tab" data-tptab="outfit" onclick="switchTravelTab('${p.id}','outfit',this)">👔 衣服储备</div>
        <div class="tab" data-tptab="pose" onclick="switchTravelTab('${p.id}','pose',this)">📸 拍照姿势</div>
      </div>

      <!-- 花费储备 -->
      <div id="tpExpense">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;">
          <div style="background:#e6f7ed;padding:12px;border-radius:10px;text-align:center;">
            <div style="font-size:18px;font-weight:800;color:var(--success);">¥${p.budget}</div>
            <div style="font-size:11px;">总预算</div>
          </div>
          <div style="background:#ffe5ec;padding:12px;border-radius:10px;text-align:center;">
            <div style="font-size:18px;font-weight:800;color:var(--danger);">¥${totalExpense}</div>
            <div style="font-size:11px;">已花费</div>
          </div>
          <div style="background:#f0e6fa;padding:12px;border-radius:10px;text-align:center;">
            <div style="font-size:18px;font-weight:800;color:${remainBudget>=0?'var(--accent)':'var(--danger)'};">¥${remainBudget}</div>
            <div style="font-size:11px;">剩余</div>
          </div>
        </div>
        <div id="expenseList">${renderExpenseList(p)}</div>
        <button class="btn btn-pink btn-sm btn-block" onclick="addExpense('${p.id}')">➕ 添加开销</button>
      </div>

      <!-- 衣服储备 -->
      <div id="tpOutfit" style="display:none;">
        <div style="background:#e0f2fe;padding:10px;border-radius:8px;margin-bottom:12px;font-size:12px;">
          💡 根据${escapeHtml(p.destination)}${p.season}季天气，从衣橱勾选衣物
        </div>
        <div id="outfitList">${renderOutfitList(p)}</div>
        <button class="btn btn-pink btn-sm btn-block" onclick="selectOutfits('${p.id}')">👔 从衣橱选择</button>
      </div>

      <!-- 拍照姿势 -->
      <div id="tpPose" style="display:none;">
        <div id="poseList">${renderPoseList(p)}</div>
        <button class="btn btn-pink btn-sm btn-block" onclick="addPose('${p.id}')">📸 添加姿势</button>
      </div>
    </div>`;

  showModal('✈️ 旅行计划管理',content,()=>true,{wide:true});
}

function switchTravelTab(pid,tab,el){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tpExpense').style.display=tab==='expense'?'block':'none';
  document.getElementById('tpOutfit').style.display=tab==='outfit'?'block':'none';
  document.getElementById('tpPose').style.display=tab==='pose'?'block':'none';
}

// 花费清单
function renderExpenseList(p){
  const expenses=p.expenses||[];
  if(expenses.length===0)return '<div class="empty-state" style="padding:20px;"><div class="empty-icon">💰</div><p>还没有记录开销</p></div>';
  return expenses.map(e=>`<div class="list-item" style="margin-bottom:6px;">
    <div class="item-info"><div class="item-title">${escapeHtml(e.category)}</div><div class="item-meta">${escapeHtml(e.note||'')}</div></div>
    <div style="font-weight:700;color:var(--danger);">¥${e.amount}</div>
    <button class="btn btn-danger btn-xs" onclick="removeExpense('${p.id}','${e.id}')">✕</button>
  </div>`).join('');
}

function addExpense(pid){
  const cats=['交通','住宿','餐饮','门票','购物','娱乐','其他'];
  showModal('➕ 添加开销',`<div class="form-row"><div class="form-group"><label>类别</label><select class="select" id="expCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-group"><label>金额</label><input class="input" type="number" id="expAmt" placeholder="0"></div></div><div class="form-group"><label>备注</label><input class="input" id="expNote" placeholder="如：高铁票"></div>`,(o)=>{
    const amt=parseFloat(o.querySelector('#expAmt').value)||0;
    if(amt<=0){showToast('请输入金额','error');return false;}
    const p=AppData.travelPlans.find(x=>x.id===pid);
    if(!p.expenses)p.expenses=[];
    p.expenses.push({id:genId(),category:o.querySelector('#expCat').value,amount:amt,note:o.querySelector('#expNote').value});
    saveData(AppData);viewTravelPlanV2(pid);showToast('✨ 已添加');
  });
}

function removeExpense(pid,eid){
  const p=AppData.travelPlans.find(x=>x.id===pid);
  p.expenses=p.expenses.filter(e=>e.id!==eid);
  saveData(AppData);viewTravelPlanV2(pid);
}

// 衣服清单
function renderOutfitList(p){
  const outfits=p.outfits||[];
  if(outfits.length===0)return '<div class="empty-state" style="padding:20px;"><div class="empty-icon">👔</div><p>还没有选择衣物</p></div>';
  return outfits.map(o=>`<div class="list-item" style="margin-bottom:6px;">
    <div class="item-info"><div class="item-title">${o.image?`<img src="${o.image}" style="width:30px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px;">`:''}${escapeHtml(o.name)}</div><div class="item-meta">${o.category} · ${o.season}季</div></div>
    <button class="btn btn-danger btn-xs" onclick="removeOutfit('${p.id}','${o.id}')">✕</button>
  </div>`).join('');
}

function selectOutfits(pid){
  const items=AppData.wardrobe.filter(w=>!w.archived);
  if(items.length===0){showToast('衣橱为空，请先添加衣物','error');return;}
  const p=AppData.travelPlans.find(x=>x.id===pid);
  const selectedIds=(p.outfits||[]).map(o=>o.id);

  const content=`<div style="max-height:300px;overflow-y:auto;">${items.map(i=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px dashed var(--pink-200);">
      <input type="checkbox" id="cl_${i.id}" ${selectedIds.includes(i.id)?'checked':''} style="width:18px;height:18px;">
      <label for="cl_${i.id}" style="flex:1;cursor:pointer;display:flex;align-items:center;gap:8px;">
        ${i.image?`<img src="${i.image}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;">`:'<div style="width:40px;height:40px;background:var(--pink-100);border-radius:8px;display:flex;align-items:center;justify-content:center;">👔</div>'}
        <div><div style="font-weight:600;">${escapeHtml(i.name)}</div><div style="font-size:11px;color:var(--text-light);">${i.category} · ${i.season}季</div></div>
      </label>
    </div>`).join('')}</div>`;

  showModal('👔 选择出行衣物',content,(o)=>{
    const checked=[];
    items.forEach(i=>{if(o.querySelector(`#cl_${i.id}`)?.checked)checked.push({id:i.id,name:i.name,category:i.category,season:i.season,image:i.image});});
    p.outfits=checked;
    saveData(AppData);viewTravelPlanV2(pid);showToast(`✨ 已选择${checked.length}件衣物`);
  },{confirmText:'💾 保存选择'});
}

function removeOutfit(pid,oid){
  const p=AppData.travelPlans.find(x=>x.id===pid);
  p.outfits=p.outfits.filter(o=>o.id!==oid);
  saveData(AppData);viewTravelPlanV2(pid);
}

// 拍照姿势
const POSE_TEMPLATES=[
  {scene:'海边',poses:['背影看海','跳跃抓拍','沙滩写字','手持贝壳','剪影夕阳']},
  {scene:'古镇',poses:['撑伞回眸','倚门而立','桥上远眺','手持团扇','巷弄漫步']},
  {scene:'山川',poses:['山顶远眺','双手张开','背影剪影','登山杖pose','云海合影']},
  {scene:'城市',poses:['街头漫步','咖啡馆窗边','地标合影','夜景灯光','天台俯瞰']},
  {scene:'美食',poses:['举杯庆祝','夹菜抓拍','与美食合影','吃相抓拍','餐厅环境']},
];

function renderPoseList(p){
  const poses=p.poses||[];
  let html='';

  // 推荐姿势模板
  html+=`<div style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">📸 推荐姿势模板</div>`;
  POSE_TEMPLATES.forEach(t=>{
    html+=`<div style="background:#fff8fb;padding:10px;border-radius:8px;margin-bottom:8px;">
      <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${t.scene}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${t.poses.map(ps=>`<span class="badge-pill" style="cursor:pointer;font-size:11px;" onclick="quickAddPose('${p.id}','${ps}')">${ps}</span>`).join('')}</div>
    </div>`;
  });
  html+='</div>';

  // 已收藏姿势
  html+=`<div><div style="font-weight:700;margin-bottom:8px;">⭐ 我的收藏(${poses.length})</div>`;
  if(poses.length===0){
    html+='<div class="empty-state" style="padding:16px;"><div class="empty-icon">📸</div><p>点击上方模板快速添加</p></div>';
  }else{
    html+=poses.map(ps=>`<div class="list-item" style="margin-bottom:6px;">
      <div class="item-info"><div class="item-title">${escapeHtml(ps.name)}</div><div class="item-meta">${escapeHtml(ps.note||'')}</div></div>
      <button class="btn btn-danger btn-xs" onclick="removePose('${p.id}','${ps.id}')">✕</button>
    </div>`).join('');
  }
  html+='</div>';

  return html;
}

function quickAddPose(pid,name){
  const p=AppData.travelPlans.find(x=>x.id===pid);
  if(!p.poses)p.poses=[];
  if(p.poses.find(ps=>ps.name===name)){showToast('已存在','warning');return;}
  p.poses.push({id:genId(),name,note:''});
  saveData(AppData);viewTravelPlanV2(pid);showToast('✨ 已收藏');
}

function addPose(pid){
  showModal('📸 添加拍照姿势',`<div class="form-group"><label>姿势名称</label><input class="input" id="poseName" placeholder="如：背影回眸"></div><div class="form-group"><label>备注</label><input class="input" id="poseNote" placeholder="如：适合海边日落"></div>`,(o)=>{
    const name=o.querySelector('#poseName').value.trim();
    if(!name){showToast('请输入名称','error');return false;}
    const p=AppData.travelPlans.find(x=>x.id===pid);
    if(!p.poses)p.poses=[];
    p.poses.push({id:genId(),name,note:o.querySelector('#poseNote').value});
    saveData(AppData);viewTravelPlanV2(pid);showToast('✨ 已添加');
  });
}

function removePose(pid,psid){
  const p=AppData.travelPlans.find(x=>x.id===pid);
  p.poses=p.poses.filter(ps=>ps.id!==psid);
  saveData(AppData);viewTravelPlanV2(pid);
}
function viewTravelPlan(id){const p=AppData.travelPlans.find(x=>x.id===id);if(!p)return;showModal('✈️ 旅行计划',`<p><strong>目的地：</strong>${escapeHtml(p.destination)}</p><p><strong>时间：</strong>${p.season}季 · ${p.days}天</p><p><strong>预算：</strong>${p.budget}元/人</p><div style="background:linear-gradient(135deg,#fff8fb,#ffe8ee);border-radius:var(--radius-md);padding:12px;margin-top:10px;white-space:pre-wrap;font-size:13px;">${escapeHtml(p.fullPlan)}</div>`,()=>true);}
function deleteTravelPlan(id){if(confirm('删除？')){AppData.travelPlans=AppData.travelPlans.filter(p=>p.id!==id);saveData(AppData);renderTravelPlans();showToast('已删除');}}
</script>

<!-- ==================== 模块4：每日进步 ==================== -->
<script>
function renderProgress(){
  const area=document.getElementById('contentArea');
  const activeTab=currentModule==='progress'?currentSubTab:'countdown';
  area.innerHTML=`<div class="tabs"><div class="tab ${activeTab==='countdown'?'active':''}" data-tab="countdown">⏰ 事项倒计时</div><div class="tab ${activeTab==='news'?'active':''}" data-tab="news">📰 时政热点</div></div><div id="progressContent"></div>`;
  area.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{currentSubTab=t.dataset.tab;renderProgress();});});
  if(activeTab==='countdown')renderCountdowns();else renderNews();
}
function renderCountdowns(){
  const items=AppData.countdowns.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  const now=new Date();
  document.getElementById('progressContent').innerHTML=`<div class="cute-card"><div class="cute-card-header"><span class="heart-icon">💗</span><span class="title-text">事项倒计时</span><button class="btn btn-primary btn-sm" onclick="addCountdown()">➕ 新增</button></div>${items.length===0?'<div class="empty-state"><div class="empty-icon">⏰</div><p>还没有倒计时事项~</p></div>':items.map(item=>{const target=new Date(item.targetDate),diff=target-now,days=Math.ceil(diff/86400000),over=diff<=0;return`<div class="list-item" style="border-left:3px solid ${over?'var(--success)':days<=7?'var(--warning)':'var(--accent)'}"><div class="item-info"><div class="item-title">${item.pinned?'📌 ':''}${escapeHtml(item.title)}</div><div class="item-meta">目标：${escapeHtml(item.targetDate)}</div></div><div style="text-align:center;"><div style="font-size:24px;font-weight:800;color:${over?'var(--success)':days<=7?'var(--warning)':'var(--accent)'};">${over?'✅':'剩 '+days+'天'}</div></div><div class="item-actions"><button class="btn btn-outline btn-xs" onclick="editCountdown('${item.id}')">编辑</button><button class="btn btn-outline btn-xs" onclick="togglePin('${item.id}')">${item.pinned?'取消':'📌'}</button><button class="btn btn-danger btn-xs" onclick="deleteCountdown('${item.id}')">删</button></div></div>`}).join('')}</div>`;
  if(_countdownTimer){clearTimeout(_countdownTimer);_countdownTimer=null;}
  if(items.length>0)_countdownTimer=setTimeout(()=>{if(currentModule==='progress'&&currentSubTab==='countdown')renderCountdowns();},60000);
}
function addCountdown(){showModal('⏰ 新建倒计时',`<div class="form-group"><label>📛 事项名称</label><input class="input" id="cdTitle" placeholder="如：考研倒计时"></div><div class="form-group"><label>📅 目标日期</label><input class="input" type="datetime-local" id="cdDate"></div><div class="form-group"><label>📍 里程碑（用|分隔）</label><input class="input" id="cdMs"></div>`,(o)=>{const t=o.querySelector('#cdTitle').value.trim(),d=o.querySelector('#cdDate').value;if(!t||!d){showToast('请填写完整','error');return false;}AppData.countdowns.push({id:genId(),title:t,targetDate:d,milestones:o.querySelector('#cdMs').value.split('|').map(s=>s.trim()).filter(Boolean),pinned:false,createdAt:today()});saveData(AppData);renderCountdowns();showToast('✨ 已创建');});}
function editCountdown(id){
  const item=AppData.countdowns.find(c=>c.id===id);if(!item)return;
  showModal('✏️ 编辑倒计时',`<div class="form-group"><label>📛 事项名称</label><input class="input" id="ecdTitle" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>📅 目标日期</label><input class="input" type="datetime-local" id="ecdDate" value="${item.targetDate}"></div><div class="form-group"><label>📍 里程碑（用|分隔）</label><input class="input" id="ecdMs" value="${(item.milestones||[]).join('|')}"></div>`,(o)=>{
    const t=o.querySelector('#ecdTitle').value.trim(),d=o.querySelector('#ecdDate').value;
    if(!t||!d){showToast('请填写完整','error');return false;}
    item.title=t;item.targetDate=d;item.milestones=o.querySelector('#ecdMs').value.split('|').map(s=>s.trim()).filter(Boolean);
    saveData(AppData);renderCountdowns();showToast('✨ 已更新');
  });
}
function togglePin(id){const item=AppData.countdowns.find(c=>c.id===id);if(item){item.pinned=!item.pinned;saveData(AppData);renderCountdowns();}}
function deleteCountdown(id){if(confirm('删除？')){AppData.countdowns=AppData.countdowns.filter(c=>c.id!==id);saveData(AppData);renderCountdowns();showToast('已删除');}}

function renderNews(){
  const items=AppData.newsItems.slice(0,10);
  document.getElementById('progressContent').innerHTML=`<div class="cute-card"><div class="cute-card-header"><span class="heart-icon">💗</span><span class="title-text">时政热点</span><button class="btn btn-primary btn-sm" onclick="fetchNews()">🔄 刷新</button></div><div id="newsList"></div></div>`;
  const el=document.getElementById('newsList');
  if(items.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">📰</div><p>点击刷新获取资讯~</p></div>';return;}

// 生成人民日报电子版当日版面链接
function getRmrbLayoutUrl(date){
  const d = date || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `http://paper.people.com.cn/rmrb/pc/layout/${y}${m}/${day}/node_01.html`;
}

}

async function fetchNews(){
  const el=document.getElementById('newsList');
  if(el)el.innerHTML='<div class="ai-processing" style="padding:20px;"><div class="ai-spinner"></div><p style="margin-top:8px;">正在获取人民日报时政热点...</p></div>';

  // 短暂延迟模拟加载
  await new Promise(r=>setTimeout(r,500));

  // 清空旧数据
  AppData.newsItems = AppData.newsItems.filter(n=>n.date!==today());

  // 生成当日人民日报版面链接
  const todayUrl = getRmrbLayoutUrl();
  const dateStr = today();

  // 添加人民日报核心栏目
  RMRB_SECTIONS.forEach(s=>{
    const url = s.url.replace('{DATE}', todayUrl.split('/layout/')[1]?.split('/node')[0] || '');
    AppData.newsItems.unshift({
      id: genId(),
      title: s.title,
      summary: s.summary,
      url: url,
      source: s.source,
      read: false,
      saved: false,
      date: dateStr
    });
  });

  saveData(AppData);
  renderNews();
  showToast('✨ 已更新人民日报时政热点');
}

function viewNews(id){
  const item=AppData.newsItems.find(n=>n.id===id);if(!item)return;
  item.read=true;saveData(AppData);
  const content=`<div style="margin-bottom:12px;"><span class="badge-pill">${escapeHtml(item.source||'资讯')}</span> <span style="font-size:12px;color:var(--text-light);">${item.date}</span></div>
    <h4 style="color:var(--accent);margin-bottom:12px;">${escapeHtml(item.title)}</h4>
    <p style="line-height:1.8;margin-bottom:16px;">${escapeHtml(item.summary)}</p>
    ${item.url?`<div style="background:#e0f2fe;padding:12px;border-radius:8px;text-align:center;"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" style="color:#0369a1;text-decoration:none;font-weight:600;">🔗 点击阅读完整原文 →</a></div>`:''}`;
  showModal('📰 时政阅读',content,()=>true);
}
function toggleSave(id){const item=AppData.newsItems.find(n=>n.id===id);if(item){item.saved=!item.saved;saveData(AppData);renderNews();}}
</script>

function renderFinance(){

function deleteFin(id){AppData.incomeExpenses=AppData.incomeExpenses.filter(r=>r.id!==id);saveData(AppData);renderFinance();showToast('已删除');}

<!-- ==================== 初始化 ==================== -->
<script>
function init(){
  const def=getDefaultData();
  if(!AppData.retirePlan||typeof AppData.retirePlan!=='object')AppData.retirePlan=def.retirePlan;
  ['incomeExpenses','wardrobe','outfitTemplates','dietPlans','calorieRecords','milkTeaMenu','milkTeaHistory','travelPlans','countdowns','newsItems'].forEach(k=>{if(!Array.isArray(AppData[k]))AppData[k]=def[k]||[];});
  if(!AppData.milkTeaMenu||AppData.milkTeaMenu.length===0)AppData.milkTeaMenu=def.milkTeaMenu;

  if(AppData.wardrobe.length===0){
    AppData.wardrobe=[
      {id:genId(),name:'白色简约衬衫',category:'衬衫',season:'春秋',style:'商务休闲',note:'通勤百搭',image:'',archived:false,createdAt:today()},
      {id:genId(),name:'黑色修身长裤',category:'长裤',season:'春秋',style:'商务',note:'通勤必备',image:'',archived:false,createdAt:today()},
      {id:genId(),name:'卡其色风衣',category:'风衣',season:'春秋',style:'休闲',note:'百搭外套',image:'',archived:false,createdAt:today()},
      {id:genId(),name:'灰色卫衣',category:'卫衣',season:'秋冬',style:'运动休闲',note:'周末穿搭',image:'',archived:false,createdAt:today()},
      {id:genId(),name:'蓝色牛仔裤',category:'长裤',season:'春秋',style:'休闲',note:'日常百搭',image:'',archived:false,createdAt:today()},
      {id:genId(),name:'碎花连衣裙',category:'连衣裙',season:'夏',style:'甜美',note:'约会穿搭',image:'',archived:false,createdAt:today()},
    ];
    AppData.countdowns=[
      {id:genId(),title:'2026年新年倒计时',targetDate:'2026-01-01T00:00',milestones:['圣诞节','元旦计划'],pinned:true,createdAt:today()},
      {id:genId(),title:'月度阅读目标',targetDate:new Date(new Date().getFullYear(),new Date().getMonth()+1,1).toISOString().slice(0,16),milestones:['读完2本书'],pinned:false,createdAt:today()},
    ];
  }
  // ⚠️ 只存本地、不立即上传云端 —— 避免用本地空默认数据覆盖云端真实数据
  _originalSaveData(AppData);

  // 初始化云端同步UI
  updateCloudUI();

  // 启动后先拉云端，再决定如何保存（防止默认空图覆盖云端）
  cloudLoad().then(async cloudData => {
    if (cloudData && cloudData._syncedAt) {
      const localTime = AppData._syncedAt ? new Date(AppData._syncedAt).getTime() : 0;
      const cloudTime = cloudData._syncedAt ? new Date(cloudData._syncedAt).getTime() : 0;
      const cleanCloud = {...cloudData};
      delete cleanCloud._syncedAt;
      delete cleanCloud._createdAt;
      if (cloudTime > localTime) {
        // 云端更新：采用云端（含图片）
        AppData = {...AppData, ...cleanCloud};
      }
      // 无论云端还是本地优先，都保存并上传最终数据
      saveData(AppData);
    } else {
      // 云端无数据：首次使用，上传本地
      saveData(AppData);
    }
    // 把本地 IndexedDB 中的图片补进云端，保证跨设备可显示
    await backfillCloudImages();
    document.getElementById('brandDate').textContent = getCnDate();
    switchModule('wardrobe');
  }).catch(() => {
    document.getElementById('brandDate').textContent = getCnDate();
    switchModule('wardrobe');
  });

  // 可见性恢复 → 同时拉取云端最新数据
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
      AppData=loadData();
      renderModule(currentModule);
      document.getElementById('brandDate').textContent=getCnDate();

      // 从云端同步最新数据
      cloudLoad().then(async cloudData => {
        if (cloudData && cloudData._syncedAt) {
          const localTime = AppData._syncedAt || '';
          const cloudTime = cloudData._syncedAt || '';
          if (cloudTime > localTime) {
            const clean = {...cloudData};
            delete clean._syncedAt; delete clean._createdAt;
            AppData = {...AppData, ...clean};
            saveData(AppData);
            renderModule(currentModule);
            showToast('☁️ 已同步云端最新数据');
          }
        }
        // 把本地图片补进云端
        await backfillCloudImages();
      }).catch(()=>{});
    }
  });

  // 大小变化（桌面端 resize 无需重渲染整个模块，仅移动端切换时需要）
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
    // 仅在跨端切换时重渲染
    const wasMobile=document.getElementById('sidebar').classList.contains('open');
    if(window.innerWidth>768&&wasMobile){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');}
  },250);});
}
document.addEventListener('DOMContentLoaded',init);
</script>
